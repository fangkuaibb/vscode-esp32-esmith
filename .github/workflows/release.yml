name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx @vscode/vsce@latest package
      - uses: actions/upload-artifact@v4
        with:
          name: esmith-vsix
          path: '*.vsix'

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: esmith-vsix
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ESmith $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --title "ESmith $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          gh release upload "$GITHUB_REF_NAME" ./esmith-*.vsix --clobber

  publish-vscode:
    needs: package
    if: vars.PUBLISH_TO_MARKETPLACES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: esmith-vsix
      - run: npx @vscode/vsce@latest publish --oidc --packagePath "$(ls *.vsix | head -n 1)"

  publish-openvsx:
    needs: package
    if: vars.PUBLISH_TO_MARKETPLACES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: esmith-vsix
      - run: npx ovsx@latest publish "$(ls *.vsix | head -n 1)" --trusted-publishing
